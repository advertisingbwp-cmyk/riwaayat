name: CI

on:
  push:
    branches: [ "codex/initial-rebuild", "main" ]
  pull_request:
    branches: [ "codex/initial-rebuild", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install validation test dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        run: npm test

      - name: Verify build and TypeScript
        run: npm run build

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Firestore security boundaries
        run: npx firebase emulators:exec --project demo-riwaayat --only firestore "node --test tests/rules.test.mjs"
