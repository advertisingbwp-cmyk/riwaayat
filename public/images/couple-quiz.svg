<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Couple Quiz invitation</title>
  <desc id="desc">An elegant plum and cream invitation with floating question cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#250d2a"/><stop offset=".55" stop-color="#5d1f50"/><stop offset="1" stop-color="#b56b71"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffe6a6" stop-opacity=".8"/><stop offset="1" stop-color="#ffe6a6" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#140817" flood-opacity=".45"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="710" cy="240" r="260" fill="url(#glow)" opacity=".38"/>
  <circle cx="80" cy="890" r="300" fill="url(#glow)" opacity=".2"/>
  <g fill="none" stroke="#f7dda0" opacity=".35"><circle cx="450" cy="550" r="375"/><circle cx="450" cy="550" r="330"/><path d="M38 550h824M450 108v884"/></g>
  <g filter="url(#shadow)" transform="rotate(-8 310 570)">
    <rect x="135" y="285" width="360" height="470" rx="28" fill="#fff9ea" stroke="#e7c986" stroke-width="4"/>
    <text x="315" y="392" text-anchor="middle" fill="#5d1f50" font-family="Georgia,serif" font-size="82" font-style="italic">?</text>
    <text x="315" y="478" text-anchor="middle" fill="#5d1f50" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">HOW WELL</text>
    <text x="315" y="520" text-anchor="middle" fill="#5d1f50" font-family="Georgia,serif" font-size="43">do you know us?</text>
    <path d="M205 570h220" stroke="#c39a55"/>
    <text x="315" y="625" text-anchor="middle" fill="#7a5a67" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PLAY OUR COUPLE QUIZ</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(10 600 615)">
    <rect x="455" y="390" width="300" height="400" rx="26" fill="#f8d98d" stroke="#fff0bd" stroke-width="4"/>
    <circle cx="605" cy="510" r="58" fill="#5d1f50"/><text x="605" y="532" text-anchor="middle" fill="#fff9ea" font-family="Georgia,serif" font-size="68" font-style="italic">2</text>
    <rect x="510" y="616" width="190" height="18" rx="9" fill="#5d1f50" opacity=".78"/><rect x="530" y="660" width="150" height="13" rx="7" fill="#5d1f50" opacity=".38"/><rect x="545" y="697" width="120" height="13" rx="7" fill="#5d1f50" opacity=".38"/>
  </g>
  <g fill="#ffe29a" font-family="Georgia,serif" font-size="38"><text x="92" y="205">✦</text><text x="760" y="310">✧</text><text x="110" y="900">✧</text><text x="790" y="850">✦</text></g>
  <text x="450" y="1000" text-anchor="middle" fill="#fff3cf" font-family="Arial,sans-serif" font-size="14" letter-spacing="7">AN INTERACTIVE INVITATION</text>
</svg>
